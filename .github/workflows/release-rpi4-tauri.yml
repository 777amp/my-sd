name: Build & Release Raspberry Pi 4B Rust/Tauri (.deb)

on:
  push:
    branches:
      - main
    tags:
      - 'v*-rust*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-rpi4-tauri-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release-tauri:
    name: Build & Release Tauri v2 ARM64 .deb for Raspberry Pi 4B (Debian 13 Trixie)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri v2 & SQLCipher Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsecret-1-dev \
            pkg-config \
            patchelf \
            build-essential \
            python3 \
            fakeroot \
            dpkg

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js and pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: true
          install: false

      - name: Read app version
        id: versions
        run: |
          node -p "'app_version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      - name: Install JS dependencies & generate frontend assets
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run generate
          node scripts/build-tauri-frontend.mjs
          pnpm run build:rolldown:tauri --minify

      - name: Run Rust unit & integration tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Cache tauri-cli binary
        id: cache_tauri_cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: rpi4-tauri-cli-v2-arm64

      - name: Install tauri-cli v2
        if: steps.cache_tauri_cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri v2 ARM64 .deb bundle
        run: cargo tauri build --bundles deb

      - name: Prepare release metadata and checksum
        id: release_meta
        run: |
          DEB_PATH=$(ls -1 src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          if [ -z "$DEB_PATH" ] || [ ! -f "$DEB_PATH" ]; then
            echo "ERROR: No .deb artifact found in src-tauri/target/release/bundle/deb/"
            ls -la src-tauri/target/release/bundle/deb/ || true
            exit 1
          fi

          DEB_DIR=$(dirname "$DEB_PATH")
          DEB_NAME=$(basename "$DEB_PATH")
          DEB_SIZE=$(du -h "$DEB_PATH" | awk '{print $1}')
          SHA256=$(sha256sum "$DEB_PATH" | awk '{print $1}')
          (cd "$DEB_DIR" && sha256sum "$DEB_NAME" > "${DEB_NAME}.sha256")

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ steps.versions.outputs.app_version }}-rpi4-rust-${{ github.run_number }}"
          fi

          {
            echo "deb_path=${DEB_PATH}"
            echo "deb_sha_path=${DEB_DIR}/${DEB_NAME}.sha256"
            echo "deb_name=${DEB_NAME}"
            echo "deb_size=${DEB_SIZE}"
            echo "sha256=${SHA256}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload ARM64 .deb workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-desktop-rust-arm64-deb
          path: |
            ${{ steps.release_meta.outputs.deb_path }}
            ${{ steps.release_meta.outputs.deb_sha_path }}

      - name: Create GitHub Release with install terminal line
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          DEB_PATH: ${{ steps.release_meta.outputs.deb_path }}
          DEB_SHA_PATH: ${{ steps.release_meta.outputs.deb_sha_path }}
          DEB_NAME: ${{ steps.release_meta.outputs.deb_name }}
          DEB_SIZE: ${{ steps.release_meta.outputs.deb_size }}
          SHA256: ${{ steps.release_meta.outputs.sha256 }}
          APP_VERSION: ${{ steps.versions.outputs.app_version }}
        run: |
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DEB_NAME}"

          cat <<EOF > release-notes-rust.md
          ## Signal Desktop ${APP_VERSION} — Rust / Tauri v2 Backend for Raspberry Pi 4B (\`arm64\`)

          Built natively on ARM64 for **Raspberry Pi 4B** running **Debian GNU/Linux 13 (Trixie)** (\`arm64\`) using the new **Tauri v2 + WebKitGTK + Native Rust SQLCipher** backend (replacing Electron/Chromium).

          ### Install (Copy & Paste in Terminal)

          \`\`\`bash
          curl -fsSL ${DOWNLOAD_URL} -o /tmp/${DEB_NAME} && sudo apt-get update && sudo apt-get install -y /tmp/${DEB_NAME} && rm -f /tmp/${DEB_NAME}
          \`\`\`

          ### Highlights
          - **Tauri v2 + WebKitGTK 4.1:** Eliminates Chromium/Electron main process overhead for drastically lower RAM usage on 2–8 GB Raspberry Pi 4B boards. *(Escape hatch: \`SIGNAL_RPI_SW_RENDER=1 signal-desktop\` for software rendering.)*
          - **Native Rust SQLCipher (\`rusqlite\`):** Opens existing \`~/.config/Signal/sql/db.sqlite\` databases (including Electron \`safeStorage\` \`v10\`/\`v11\` key decryption) with microSD-friendly WAL PRAGMAs (\`synchronous=NORMAL\`, \`temp_store=MEMORY\`, 16 MB page cache, 64 MB mmap).
          - **Native Rust Attachments & Tray:** Path-sandboxed \`attachment://\` protocol with AES-256-CBC + HMAC-SHA256 decryption and Ayatana AppIndicator Linux system tray.
          - **Headless Node.js Sidecar:** Low-RAM (\`--max-old-space-size=256 --optimize-for-size\`) JSON-RPC worker for \`@signalapp/libsignal-client\`, QR device linking, and Signal WebSockets.

          ### Artifact Info
          - **Package:** \`${DEB_NAME}\` (${DEB_SIZE})
          - **SHA-256:** \`${SHA256}\`
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB_PATH" "$DEB_SHA_PATH" --clobber
            gh release edit "$TAG" --title "Signal Desktop ${APP_VERSION} Rust/Tauri v2 (Raspberry Pi 4B arm64)" --notes-file release-notes-rust.md
          else
            gh release create "$TAG" "$DEB_PATH" "$DEB_SHA_PATH" \
              --title "Signal Desktop ${APP_VERSION} Rust/Tauri v2 (Raspberry Pi 4B arm64)" \
              --notes-file release-notes-rust.md
          fi
